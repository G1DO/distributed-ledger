name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-jdk25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (strict)
        working-directory: service
        run: ./mvnw -B verify -Pstrict
      - name: Check documentation taxonomy
        run: python3 scripts/check-docs.py
      - name: O2 lifecycle and PostgreSQL recovery on Compose
        run: python3 scripts/o2-compose-e2e.py
      - name: Record evidence source
        if: always()
        run: |
          mkdir -p service/target/o2-evidence
          git rev-parse HEAD > service/target/o2-evidence/commit.txt
          git status --porcelain > service/target/o2-evidence/worktree.txt
          java -version 2> service/target/o2-evidence/java.txt
          docker version > service/target/o2-evidence/docker.txt
          docker compose version > service/target/o2-evidence/compose.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > service/target/o2-evidence/ci-url.txt
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-jdk25
          path: |
            service/target/surefire-reports/
            service/target/failsafe-reports/
            service/target/process-crash/
            service/target/o2-*/
          retention-days: 30

  build-jdk26:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Verify compat lane (allowed fail)
        working-directory: service
        run: ./mvnw -B verify -Pstrict,compat26
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-jdk26
          path: |
            service/target/surefire-reports/
            service/target/failsafe-reports/
            service/target/process-crash/
            service/target/o2-*/
          retention-days: 30

  osv:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            scan
            source
            --recursive
            ./
