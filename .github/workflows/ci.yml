name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-jdk25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (strict)
        working-directory: service
        run: ./mvnw -B verify -Pstrict
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-jdk25
          path: |
            service/target/surefire-reports/
            service/target/failsafe-reports/
            service/target/process-crash/
          retention-days: 30

  build-jdk26:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Verify compat lane (allowed fail)
        working-directory: service
        run: ./mvnw -B verify -Pstrict,compat26
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-jdk26
          path: |
            service/target/surefire-reports/
            service/target/failsafe-reports/
            service/target/process-crash/
          retention-days: 30

  osv:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            scan
            source
            --recursive
            ./
